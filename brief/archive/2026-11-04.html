<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" data-lang="both">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#F6F4EF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Buddy">
<title>Buddy · 晨间情报</title>
<style>
:root{
  --paper:#F4F1EA; --card:#FFFFFF; --card-2:#FBFAF6;
  --ink:#17161A; --ink-2:#4B4852; --ink-3:#8A8590;
  --line:#E5E0D5; --line-2:#EFEBE2;
  --accent:#1F5C4B; --amber:#B45309;
  --up:#C0392B; --down:#1E7A54;
  --shadow:0 1px 2px rgba(30,25,15,.05), 0 8px 24px -12px rgba(30,25,15,.14);
  --shadow-lg:0 2px 4px rgba(30,25,15,.06), 0 18px 40px -18px rgba(30,25,15,.22);
  --serif:ui-serif,"Iowan Old Style",Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
[data-theme="dark"]{
  --paper:#100F0D; --card:#1A1917; --card-2:#201E1B;
  --ink:#F3F0E8; --ink-2:#B7B1A6; --ink-3:#7C776E;
  --line:#2B2823; --line-2:#232019;
  --accent:#7CC4A4; --amber:#E0A063;
  --up:#E4705F; --down:#5FBE94;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
  --shadow-lg:0 2px 4px rgba(0,0,0,.5), 0 18px 40px -18px rgba(0,0,0,.8);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--paper); color:var(--ink);
  font-family:var(--sans);
  font-size:16px; line-height:1.6;
  transition:background .35s ease,color .35s ease;
  overflow-x:hidden;
}
body::before{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
  background:
    radial-gradient(900px 500px at 50% -180px, rgba(31,92,75,.055), transparent 70%),
    radial-gradient(700px 400px at 100% 100%, rgba(180,83,9,.045), transparent 70%);
}
[data-theme="dark"] body::before{
  background:
    radial-gradient(900px 500px at 50% -180px, rgba(124,196,164,.07), transparent 70%),
    radial-gradient(700px 400px at 100% 100%, rgba(224,160,99,.05), transparent 70%);
}

/* ---------- 进度条 ---------- */
#progress{
  position:fixed; top:0; left:0; height:2px; width:0%;
  background:linear-gradient(90deg,var(--accent),var(--amber));
  z-index:100; transition:width .12s linear;
}

.wrap{max-width:540px; margin:0 auto; padding:0 20px 64px; position:relative; z-index:1}

/* ---------- 顶栏 ---------- */
header{
  display:flex; align-items:center; justify-content:space-between;
  padding:22px 0 14px; gap:12px;
}
.brand{display:flex; align-items:center; gap:9px; font-weight:700; letter-spacing:-.01em; font-size:17px}
.dot{
  width:9px;height:9px;border-radius:50%;
  background:var(--accent); position:relative; flex:none;
}
.dot::after{
  content:""; position:absolute; inset:-4px; border-radius:50%;
  border:1.5px solid var(--accent); opacity:0;
  animation:pulse 2.8s ease-out infinite;
}
@keyframes pulse{0%{opacity:.55;transform:scale(.7)}70%{opacity:0;transform:scale(1.5)}100%{opacity:0}}
.brand small{
  font-size:10.5px; font-weight:600; letter-spacing:.14em; text-transform:uppercase;
  color:var(--ink-3); padding-left:9px; margin-left:3px; border-left:1px solid var(--line);
}
.head-tools{display:flex; align-items:center; gap:6px}
.icon-btn{
  width:34px;height:34px;border-radius:11px;border:1px solid var(--line);
  background:var(--card); color:var(--ink-2); font-size:15px;
  display:grid;place-items:center;cursor:pointer;padding:0;
  transition:all .18s ease;
}
.icon-btn:hover{border-color:var(--ink-3);color:var(--ink)}
.icon-btn:active{transform:scale(.94)}
.icon-btn.on{background:var(--accent);border-color:var(--accent);color:#fff}
[data-theme="dark"] .icon-btn.on{color:#0F211B}
#langBtn{font-size:11px; font-weight:700; letter-spacing:.02em; font-family:inherit}

/* ---------- 日期带 ---------- */
.dateline{
  display:flex; align-items:baseline; gap:10px; flex-wrap:wrap;
  padding-bottom:18px; border-bottom:1px solid var(--line);
  font-size:12.5px; color:var(--ink-3); letter-spacing:.02em;
}
.dateline b{color:var(--ink); font-weight:600; font-variant-numeric:tabular-nums}
.dateline .sep{width:3px;height:3px;border-radius:50%;background:var(--ink-3);opacity:.5;display:inline-block;transform:translateY(-3px)}

/* ---------- Hero ---------- */
.hero{padding:30px 0 8px}
.kicker{
  font-size:10px; font-weight:700; letter-spacing:.2em; text-transform:uppercase;
  color:var(--accent); display:flex; align-items:center; gap:8px; margin-bottom:15px;
}
.kicker::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.hero h1{
  font-family:var(--serif); font-weight:600;
  font-size:26px; line-height:1.34; letter-spacing:-.02em;
  margin:0 0 14px; text-wrap:balance;
}
.hero .zh{
  font-size:15.5px; line-height:1.85; color:var(--ink-2);
  margin:0; letter-spacing:.01em;
}
.hero-meta{
  display:flex; gap:14px; flex-wrap:wrap; margin-top:18px;
  font-size:11.5px; color:var(--ink-3); letter-spacing:.03em;
}
.hero-meta i{font-style:normal; font-variant-numeric:tabular-nums}

/* ---------- 市场条 ---------- */
.ticker-wrap{margin:26px -20px 0; padding:0}
.ticker{
  display:flex; gap:9px; overflow-x:auto; padding:4px 20px 12px;
  scrollbar-width:none; -webkit-overflow-scrolling:touch;
  scroll-snap-type:x proximity;
}
.ticker::-webkit-scrollbar{display:none}
.tick{
  flex:none; min-width:96px; scroll-snap-align:start;
  background:var(--card); border:1px solid var(--line);
  border-radius:14px; padding:10px 12px 9px;
  box-shadow:var(--shadow);
}
.tick .n{font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3); font-weight:600; white-space:nowrap}
.tick .v{font-size:16px; font-weight:650; font-variant-numeric:tabular-nums; letter-spacing:-.02em; margin-top:2px}
.tick .c{font-size:11.5px; font-weight:600; font-variant-numeric:tabular-nums; margin-top:1px}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--ink-3)}

/* ---------- 筛选 tab ---------- */
.tabs{
  position:sticky; top:0; z-index:30;
  display:flex; gap:7px; overflow-x:auto; scrollbar-width:none;
  margin:14px -20px 0; padding:12px 20px;
  background:linear-gradient(to bottom, var(--paper) 62%, transparent);
  backdrop-filter:blur(8px);
}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:none; border:1px solid var(--line); background:var(--card);
  color:var(--ink-2); font-size:12.5px; font-weight:600; font-family:inherit;
  padding:7px 14px; border-radius:999px; cursor:pointer;
  transition:all .2s ease; white-space:nowrap;
}
.tab:active{transform:scale(.96)}
.tab.on{background:var(--ink); border-color:var(--ink); color:var(--paper)}
[data-theme="dark"] .tab.on{background:var(--ink); color:#100F0D}

/* ---------- 板块标题 ---------- */
.group{margin-top:30px; animation:fadeUp .5s ease both}
.group-head{display:flex; align-items:center; gap:10px; margin-bottom:14px}
.group-head .bar{width:3px;height:15px;border-radius:2px;flex:none}
.group-head h2{margin:0; font-size:13px; font-weight:700; letter-spacing:.06em}
.group-head .en{font-size:10.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-3); font-weight:600}
.group-head .cnt{margin-left:auto; font-size:11px; color:var(--ink-3); font-variant-numeric:tabular-nums}

/* ---------- 卡片 ---------- */
.card{
  position:relative; background:var(--card); border:1px solid var(--line);
  border-radius:19px; padding:19px 18px 16px; margin-bottom:13px;
  box-shadow:var(--shadow);
  transition:box-shadow .25s ease, transform .25s ease, border-color .25s ease;
}
.card.pending{opacity:0; transform:translateY(14px)}
.card.in{opacity:1; transform:none; transition:opacity .5s ease, transform .5s cubic-bezier(.2,.8,.3,1), box-shadow .25s ease, border-color .25s ease}
.card:active{transform:scale(.995)}
.card.flash{border-color:var(--amber)}
.card-top{display:flex; align-items:center; gap:8px; margin-bottom:12px}
.pill{
  --sec:#888888;
  font-size:10.5px; font-weight:700; letter-spacing:.04em;
  padding:3.5px 9px; border-radius:7px; white-space:nowrap;
  background:rgba(120,120,120,.12); color:var(--sec);
  background:color-mix(in srgb, var(--sec) 12%, transparent);
}
[data-theme="dark"] .pill{
  background:color-mix(in srgb, var(--sec) 20%, transparent);
  color:color-mix(in srgb, var(--sec) 38%, #ffffff);
}
.imp{display:flex; gap:2.5px; margin-left:auto; align-items:center}
.imp i{width:4px;height:4px;border-radius:50%;background:var(--line);display:block}
.imp i.f{background:var(--amber)}
.save{
  background:none;border:none;padding:2px 0 2px 8px;cursor:pointer;
  color:var(--ink-3); font-size:15px; line-height:1; font-family:inherit;
  transition:transform .2s ease, color .2s ease;
}
.save:active{transform:scale(1.3)}
.save.on{color:var(--amber)}

.t-en{
  font-family:var(--serif); font-weight:600; font-size:20px; line-height:1.32;
  letter-spacing:-.015em; margin:0 0 9px;
}
.b-en{
  font-size:14.5px; line-height:1.66; color:var(--ink-2); margin:0;
  letter-spacing:.004em;
}
.divider{
  display:flex; align-items:center; gap:10px; margin:15px 0 13px;
  font-size:9.5px; letter-spacing:.22em; text-transform:uppercase;
  color:var(--ink-3); font-weight:700;
}
.divider::before,.divider::after{content:""; height:1px; background:var(--line-2); flex:1}
.divider::before{flex:0 0 22px}
.t-zh{font-size:16.5px; font-weight:650; line-height:1.55; margin:0 0 8px; letter-spacing:-.005em}
.b-zh{font-size:14.5px; line-height:1.88; color:var(--ink-2); margin:0; letter-spacing:.012em}

.why{
  margin-top:14px; padding:12px 13px 12px 14px;
  background:var(--card-2); border-radius:12px;
  border-left:2.5px solid var(--amber);
}
.why b{
  display:block; font-size:10px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--amber); margin-bottom:5px; font-weight:700;
}
.why p{margin:0; font-size:13.5px; line-height:1.8; color:var(--ink-2); letter-spacing:.01em}

.card-foot{
  display:flex; align-items:center; gap:8px; margin-top:14px;
  font-size:10.5px; color:var(--ink-3); letter-spacing:.03em;
}
.card-foot a{margin-left:auto; color:var(--ink-3); text-decoration:none; border-bottom:1px dotted var(--line); padding-bottom:1px}
.card-foot a:hover{color:var(--accent); border-color:var(--accent)}

/* ---------- 语言模式 ---------- */
[data-lang="zh"] .t-en,[data-lang="zh"] .b-en,[data-lang="zh"] .divider{display:none}
[data-lang="zh"] .t-zh{font-size:18px}
[data-lang="en"] .t-zh,[data-lang="en"] .b-zh,[data-lang="en"] .divider,[data-lang="en"] .why{display:none}
[data-lang="en"] .hero .zh{display:none}
[data-lang="en"] .t-en{font-size:21px}
[data-lang="zh"] .hero h1{display:none}

/* ---------- 认知卡 ---------- */
.insight{
  margin-top:38px; border-radius:22px; overflow:hidden;
  background:linear-gradient(165deg,#17332B 0%, #10241E 60%, #0D1D18 100%);
  color:#EFEDE4; padding:26px 22px 24px;
  box-shadow:var(--shadow-lg); position:relative;
}
[data-theme="dark"] .insight{
  background:linear-gradient(165deg,#1C3B31 0%, #14291F 60%, #0F2018 100%);
  border:1px solid rgba(124,196,164,.16);
}
.insight::after{
  content:""; position:absolute; top:-60px; right:-50px; width:200px; height:200px;
  border-radius:50%; background:radial-gradient(circle,rgba(224,160,99,.22),transparent 68%);
}
.ins-kicker{
  font-size:9.5px; letter-spacing:.24em; text-transform:uppercase;
  color:#D9A66B; font-weight:700; margin-bottom:14px;
  display:flex; align-items:center; gap:8px; position:relative; z-index:1;
}
.insight h2{
  font-family:var(--serif); font-size:22px; font-weight:600; line-height:1.3;
  margin:0 0 6px; letter-spacing:-.015em; position:relative; z-index:1;
}
.insight .h2-zh{
  font-family:var(--sans); font-size:15px; font-weight:600; color:#C9C5B8;
  margin:0 0 16px; letter-spacing:.02em; position:relative; z-index:1;
}
.insight p{
  font-size:13.5px; line-height:1.78; color:#BEB9AC; margin:0 0 12px;
  position:relative; z-index:1;
}
.insight .zh-body{font-size:14px; line-height:1.9; color:#DCD8CB; letter-spacing:.012em}
.insight .q{
  margin-top:18px; padding-top:16px; border-top:1px solid rgba(255,255,255,.1);
  font-size:14px; line-height:1.85; color:#F2EEE0; position:relative; z-index:1;
}
.insight .q::before{
  content:"?"; display:inline-grid; place-items:center;
  width:17px;height:17px; border-radius:50%;
  background:rgba(224,160,99,.2); color:#E8B87F;
  font-size:11px; font-weight:700; margin-right:7px; vertical-align:1px;
}
[data-lang="en"] .insight .zh-body,[data-lang="en"] .insight .h2-zh,[data-lang="en"] .insight .q{display:none}
[data-lang="zh"] .insight h2,[data-lang="zh"] .insight p.en-body{display:none}
[data-lang="zh"] .insight .h2-zh{font-size:19px;color:#fff;font-weight:700;margin-bottom:14px}

/* ---------- 明日关注 ---------- */
.watch{margin-top:34px}
.watch h3{
  font-size:10.5px; letter-spacing:.18em; text-transform:uppercase;
  color:var(--ink-3); font-weight:700; margin:0 0 13px;
  display:flex; align-items:center; gap:9px;
}
.watch h3::after{content:"";flex:1;height:1px;background:var(--line)}
.w-item{
  display:flex; gap:12px; padding:11px 0; border-bottom:1px solid var(--line-2);
  font-size:13.5px; line-height:1.66; color:var(--ink-2);
}
.w-item:last-child{border-bottom:none}
.w-item .when{
  flex:none; width:42px; font-size:10.5px; font-weight:700; color:var(--accent);
  letter-spacing:.04em; padding-top:2.5px; font-variant-numeric:tabular-nums;
}

footer{
  margin-top:40px; padding-top:22px; border-top:1px solid var(--line);
  font-size:11px; line-height:1.85; color:var(--ink-3); letter-spacing:.02em;
}
footer .f-brand{display:flex;align-items:center;gap:7px;color:var(--ink-2);font-weight:600;font-size:12px;margin-bottom:9px}
footer .f-brand .dot{width:6px;height:6px}
footer .f-brand .dot::after{display:none}

@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

@media (min-width:640px){
  .hero h1{font-size:30px}
  .wrap{padding-bottom:90px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  .card,.card.pending{opacity:1!important;transform:none!important}
}

/* ---------- Ask AI：浮标 ---------- */
.ask-fab{
  position:fixed; right:18px; bottom:20px; z-index:80;
  height:48px; padding:0 17px 0 13px; border-radius:999px;
  border:none; background:var(--accent); color:#fff;
  display:flex; align-items:center; gap:7px;
  font-family:inherit; font-size:13.5px; font-weight:700; letter-spacing:.02em;
  box-shadow:0 8px 22px -8px rgba(31,92,75,.6), 0 2px 5px rgba(30,25,15,.18);
  cursor:pointer; transition:transform .18s ease, box-shadow .18s ease, opacity .2s ease;
}
[data-theme="dark"] .ask-fab{color:#0F211B}
.ask-fab:active{transform:scale(.94)}
.ask-fab svg{width:15px;height:15px;display:block}
.ask-fab.hide{opacity:0;pointer-events:none;transform:scale(.9)}
body.has-ask .wrap{padding-bottom:120px}

/* ---------- Ask AI：面板 ---------- */
.ask-scrim{
  position:fixed; inset:0; z-index:90;
  background:rgba(18,16,12,.44); backdrop-filter:blur(2px);
  opacity:0; pointer-events:none; transition:opacity .3s ease;
}
.ask-scrim.on{opacity:1;pointer-events:auto}

.ask-sheet{
  position:fixed; left:0; right:0; bottom:0; z-index:95;
  height:78vh; max-height:78vh;
  display:flex; flex-direction:column;
  background:var(--card); border:1px solid var(--line); border-bottom:none;
  border-radius:22px 22px 0 0;
  box-shadow:0 -14px 44px -14px rgba(30,25,15,.34);
  transform:translateY(102%);
  transition:transform .34s cubic-bezier(.22,.9,.28,1);
  padding-bottom:env(safe-area-inset-bottom);
}
.ask-sheet.on{transform:none}
@media (min-width:640px){
  .ask-sheet{left:calc(50% - 270px); right:calc(50% - 270px)}
}

.ask-head{
  display:flex; align-items:center; gap:9px;
  padding:16px 18px 12px; border-bottom:1px solid var(--line-2); flex:none;
}
.ask-head .ttl{display:flex;align-items:center;gap:8px;font-size:14.5px;font-weight:700;letter-spacing:-.01em}
.ask-head .ttl .dot{width:7px;height:7px}
.ask-head .ttl .dot::after{display:none}
.ask-head .sub{font-size:10.5px;color:var(--ink-3);letter-spacing:.06em;font-weight:600;
  min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex-shrink:1}
.ask-quota{
  margin-left:auto; flex:none; display:inline-flex; align-items:center; gap:5px;
  height:24px; padding:0 9px; border-radius:20px; cursor:pointer;
  border:1px solid var(--line); background:transparent; color:var(--ink-3);
  font-family:inherit; font-size:10.5px; font-weight:700; letter-spacing:.04em;
  white-space:nowrap; transition:background .2s,color .2s,border-color .2s;
}
.ask-quota:active{transform:scale(.96)}
.ask-quota.warn{color:#B4552F;border-color:rgba(180,85,47,.45)}
.ask-quota.out{background:#B4552F;border-color:#B4552F;color:#fff}
.ask-head .ask-x{margin-left:8px}
.ask-x{
  margin-left:auto; width:30px;height:30px;border-radius:9px;
  border:1px solid var(--line); background:transparent; color:var(--ink-3);
  font-family:inherit; font-size:13px; cursor:pointer; display:grid;place-items:center;
}
.ask-x:active{transform:scale(.92)}

.ask-log{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:14px 18px 6px}
.ask-log::-webkit-scrollbar{width:0}
.msg{display:flex; margin-bottom:13px; animation:fadeUp .3s ease both}
.msg.u{justify-content:flex-end}
.bub{
  max-width:87%; border-radius:16px; padding:10px 14px;
  font-size:14px; line-height:1.8; letter-spacing:.01em; word-break:break-word;
}
.msg.u .bub{background:var(--accent); color:#fff; border-bottom-right-radius:5px; font-size:14px}
[data-theme="dark"] .msg.u .bub{color:#0F211B}
.msg.b .bub{
  background:var(--card-2); border:1px solid var(--line); color:var(--ink-2);
  border-bottom-left-radius:5px;
}
.bub strong{color:var(--ink); font-weight:700}
[data-theme="dark"] .msg.u .bub strong{color:#0F211B}
.bub ul{margin:6px 0; padding-left:16px}
.bub li{margin:3px 0}
.bub .src{display:block;margin-top:8px;font-size:11px;color:var(--ink-3);letter-spacing:.03em}
.msg.err .bub{background:rgba(192,57,43,.08); border-color:rgba(192,57,43,.3); color:var(--up)}

.think{display:inline-flex; gap:4px; align-items:center; padding:3px 0}
.think i{width:5px;height:5px;border-radius:50%;background:var(--ink-3);opacity:.4;animation:blink 1.2s infinite}
.think i:nth-child(2){animation-delay:.18s}
.think i:nth-child(3){animation-delay:.36s}
@keyframes blink{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:.9;transform:translateY(-2px)}}

.ask-chips{
  display:flex; gap:7px; overflow-x:auto; scrollbar-width:none;
  padding:8px 18px 10px; flex:none;
}
.ask-chips::-webkit-scrollbar{display:none}
.chip{
  flex:none; border:1px solid var(--line); background:var(--card-2);
  color:var(--ink-2); font-family:inherit; font-size:12px; font-weight:600;
  padding:7px 12px; border-radius:999px; cursor:pointer; white-space:nowrap;
  transition:all .18s ease;
}
.chip:active{transform:scale(.96); border-color:var(--accent); color:var(--accent)}

.ask-form{
  display:flex; align-items:flex-end; gap:8px; flex:none;
  padding:10px 18px 12px; border-top:1px solid var(--line-2);
}
.ask-mic{
  flex:none; width:40px; height:40px; border-radius:13px;
  border:1px solid var(--line); background:var(--card-2); color:var(--ink-2);

    '<span class="sep"></span><span>'+wd+'</span>'+

    '<span class="sep"></span><span>'+(B.meta.readMinutes||6)+' 分钟读完</span>';

  /* ---------- 渲染 ---------- */
  var total = B.sections.reduce(function(n,s){return n+s.items.length},0);

  var html = '';

  /* hero */
  html += '<section class="hero">'+
    '<div class="kicker">Today in one line</div>'+
    '<h1>'+esc(B.meta.tldr_en)+'</h1>'+
    '<p class="zh">'+esc(B.meta.tldr_zh)+'</p>'+
    '<div class="hero-meta"><span>'+total+' 条精选</span><span>'+B.sections.length+' 个板块</span><span>每日 07:30 更新</span></div>'+

  if(B.pulse && B.pulse.length){

      var cls = p.dir === 'up' ? 'up' : p.dir === 'down' ? 'down' : 'flat';
      html += '<div class="tick"><div class="n">'+esc(p.label)+'</div>'+
              '<div class="v">'+esc(p.value)+'</div>'+
              '<div class="c '+cls+'">'+esc(p.change)+'</div></div>';
    });
    html += '</div></div>';
  }

  /* tabs */
  html += '<nav class="tabs"><button class="tab on" data-f="all">全部</button>';
  B.sections.forEach(function(s){
    html += '<button class="tab" data-f="'+s.id+'">'+esc(s.name)+'</button>';

        '<div class="why"><b>Why it matters · 为什么重要</b><p>'+esc(it.why)+'</p></div>'+
        '<div class="card-foot"><span>'+esc(it.source)+'</span>'+
          (it.url?'<a href="'+it.url+'" target="_blank" rel="noopener">原文 →</a>':'')+
          '<button class="ask-inline" data-ask="'+esc(it.zh.title)+'">问这条</button>'+
        '</div>'+
      '</article>';
    });
    html += '</section>';
  });

  /* insight */
  if(B.insight){
    var I = B.insight;
    html += '<section class="insight">'+
      '<div class="ins-kicker">认知加餐 · Mental Model</div>'+
      '<h2>'+esc(I.title_en)+'</h2>'+
      '<div class="h2-zh">'+esc(I.title_zh)+'</div>'+
      '<p class="en-body">'+esc(I.body_en)+'</p>'+
      '<p class="zh-body">'+esc(I.body_zh)+'</p>'+
      '<div class="q">'+esc(I.question)+'</div>'+
    '</section>';
  }

  /* watch */
  if(B.watch && B.watch.length){
    html += '<section class="watch"><h3>明日关注 · On Deck</h3>';
    B.watch.forEach(function(w){
      html += '<div class="w-item"><span class="when">'+esc(w.when)+'</span><span>'+esc(w.text)+'</span></div>';
    });
    html += '</section>';
  }

  html += '<footer>'+
    '<div class="f-brand"><span class="dot"></span>Buddy Morning Brief</div>'+
    '<div>'+esc(B.meta.footer||'每天 07:30 更新。内容由 Buddy 从公开信源整理，中英文对照仅供阅读与语言学习，不构成任何投资建议。')+'</div>'+
    '<div style="margin-top:7px;opacity:.72">编译于 '+esc(B.meta.generatedAt||'')+'</div>'+
  '</footer>';

  app.innerHTML = html;

  /* ---------- 筛选 ---------- */
  var tabs = document.querySelectorAll('.tab');
  tabs.forEach(function(t){
    t.addEventListener('click', function(){
      tabs.forEach(function(x){x.classList.remove('on')});
      t.classList.add('on');
      var f = t.dataset.f;
      document.querySelectorAll('.group').forEach(function(g){
        g.style.display = (f==='all' || g.dataset.sec===f) ? '' : 'none';
      });
      window.scrollTo({top:0, behavior:'smooth'});
    });
  });

  /* ---------- 进场动画 ---------- */
  var cards = document.querySelectorAll('.card');
  if('IntersectionObserver' in window){
    var io = new IntersectionObserver(function(es){
      es.forEach(function(e){
        if(e.isIntersecting){
          e.target.classList.remove('pending');
          e.target.classList.add('in');
          io.unobserve(e.target);
        }
      });
    }, {rootMargin:'0px 0px -40px 0px', threshold:.05});
    cards.forEach(function(c,i){
      c.classList.add('pending');
      c.style.transitionDelay = (i%3)*55+'ms';
      io.observe(c);
    });
  } else {
    cards.forEach(function(c){ c.classList.add('in'); });
  }

  /* ---------- 收藏 ---------- */
  var saved = {};
  try { saved = JSON.parse(localStorage.getItem('buddy.saved')||'{}'); } catch(e){}
  document.querySelectorAll('.save').forEach(function(b){
    if(saved[b.dataset.id]){ b.classList.add('on'); b.textContent='★'; }
    b.addEventListener('click', function(e){
      e.stopPropagation();
      var id = b.dataset.id;
      if(saved[id]){ delete saved[id]; b.classList.remove('on'); b.textContent='☆'; }
      else { saved[id]=1; b.classList.add('on'); b.textContent='★'; }
      try{ localStorage.setItem('buddy.saved', JSON.stringify(saved)); }catch(err){}
    });
  });

  /* ---------- 语言 ---------- */
  var langs = ['both','zh','en'];
  var lang = localStorage.getItem('buddy.lang') || 'both';
  function applyLang(){
    document.documentElement.dataset.lang = lang;
    var lb = $('#langBtn');
    lb.textContent = lang === 'both' ? '中英' : (lang === 'zh' ? '中' : 'EN');
    lb.classList.toggle('on', lang !== 'both');
    lb.title = '当前：' + (lang === 'both' ? '中英对照' : lang === 'zh' ? '仅中文' : '仅英文');
  }
  applyLang();
  $('#langBtn').addEventListener('click', function(){
    lang = langs[(langs.indexOf(lang)+1) % langs.length];
    localStorage.setItem('buddy.lang', lang);
    applyLang();
  });

  /* ---------- 主题 ---------- */
  var theme = localStorage.getItem('buddy.theme') ||
    (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  function applyTheme(){
    document.documentElement.dataset.theme = theme;
    $('meta[name=theme-color]').setAttribute('content', theme==='dark' ? '#100F0D' : '#F4F1EA');
  }
  applyTheme();
  $('#themeBtn').addEventListener('click', function(){
    theme = theme === 'light' ? 'dark' : 'light';
    localStorage.setItem('buddy.theme', theme);
    applyTheme();
  });

  /* ---------- 朗读 ---------- */
  var speaking = false;
  $('#speakBtn').addEventListener('click', function(){
    if(!('speechSynthesis' in window)) return;
    if(speaking){ speechSynthesis.cancel(); speaking=false; $('#speakBtn').classList.remove('on'); return; }
    var text = B.meta.tldr_zh + '。' +
      B.sections.map(function(s){ return s.name + '：' + s.items.map(function(i){return i.zh.title}).join('；'); }).join('。');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'zh-CN'; u.rate = 1.02; u.pitch = 1;
    u.onend = function(){ speaking=false; $('#speakBtn').classList.remove('on'); };
    speechSynthesis.speak(u);
    speaking = true; $('#speakBtn').classList.add('on');
  });

  /* ---------- 进度条 ---------- */
  var bar = $('#progress');
  function onScroll(){
    var h = document.documentElement.scrollHeight - window.innerHeight;
    bar.style.width = h > 0 ? (window.scrollY / h * 100) + '%' : '0%';
  }
  window.addEventListener('scroll', onScroll, {passive:true});
  onScroll();

  /* ---------- utils ---------- */
  function esc(s){
    return String(s==null?'':s).replace(/[&<>"']/g, function(m){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];
    });
  }
})();
</script>
</body>
</html>
